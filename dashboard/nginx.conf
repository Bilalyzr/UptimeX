# Dashboard static hosting + API reverse proxy. Same-origin deployments need
# no CORS; the SPA uses relative /api and /health URLs.
#
# The monitor upstream is resolved at REQUEST time through Docker's embedded
# DNS (127.0.0.11), not at nginx startup: if the dashboard container starts
# before the monitor container exists (e.g. host-reboot restart ordering),
# nginx must still boot and simply return 502 until the monitor appears.
# A static `proxy_pass http://monitor:8080` would hard-fail with
# "host not found in upstream" and crash-loop the container.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA with history routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Monitoring API -> Go monitor service.
    location /api/ {
        set $monitor_upstream http://monitor:8080;
        proxy_pass $monitor_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Heartbeat/liveness -> Go monitor service.
    location = /health {
        set $monitor_upstream http://monitor:8080;
        proxy_pass $monitor_upstream;
    }
    location = /ready {
        set $monitor_upstream http://monitor:8080;
        proxy_pass $monitor_upstream;
    }
}
