# Dashboard static hosting + API reverse proxy. Same-origin deployments need
# no CORS; the SPA uses relative /api and /health URLs.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA with history routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Monitoring API -> Go monitor service.
    location /api/ {
        proxy_pass http://monitor:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Heartbeat/liveness -> Go monitor service.
    location = /health {
        proxy_pass http://monitor:8080/health;
    }
    location = /ready {
        proxy_pass http://monitor:8080/ready;
    }
}
