# CI pipeline (PRD §30): formatting -> static checks -> unit tests ->
# race tests -> integration (PostgreSQL) -> build -> frontend -> Docker.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: healthmonitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://monitor:monitor@localhost:5432/healthmonitor?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Static checks (go vet)
        run: go vet ./...

      - name: Unit + E2E tests (SQLite)
        run: go test ./... -count=1

      - name: Race detection
        run: go test -race -count=1 ./internal/... ./tests/e2e/...

      - name: Integration tests (PostgreSQL)
        run: go test -count=1 -v ./tests/integration/...

      - name: Build
        run: go build ./...

  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Build monitor image
        run: docker build -t uptimex:ci .

      - name: Build dashboard image
        run: docker build -t uptimex-dashboard:ci ./dashboard

      # Compose validation: the stack must come up healthy.
      - name: Compose smoke test
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/api/v1/metrics/overview
          curl -sf -o /dev/null http://localhost:8090/
          docker compose down -v
